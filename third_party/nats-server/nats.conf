# NATS for JARVIS (plan section 4.2): the software postal service between the programs.
# Local only (Q7) and bounded (Q4). The launcher passes the port from launcher/ports.toml with -p, which overrides
# the port below; tests start their own server on a free port the same way.

listen: 127.0.0.1:4222

max_connections: 64
max_payload: 1MB
max_pending: 64MB
max_control_line: 4KB
write_deadline: "10s"
ping_interval: "20s"
ping_max: 3
